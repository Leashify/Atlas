[workspace]
resolver = "2"

members = [
    "common",
    "mirror-npm",
    "mirror-crates",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Leashify"]
repository = "https://github.com/Leashify/Atlas"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
